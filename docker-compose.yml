# dbAPI — Docker Compose (local dev)
#
# Requires PHP 8.3 (see Dockerfile). App: http://localhost:8888
# Run PHPUnit on PHP 8.3: bash scripts/run-phpunit-docker.sh
# Webhooks/Redis: use docker/base/ (optional; not needed for the data plane).

services:
  dbapi:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8888:80"
    volumes:
      - ./src:/app
      - ./dbconfigs:/app/apis
    depends_on:
      - mysql
    environment:
      - BASE_URL=http://localhost:8888
      - DEPLOYMENT_MODE=single
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=myapp
      - DB_USER=user
      - DB_PASSWORD=password
      - CONFIGS_DIR=/app/apis
      - DEFAULT_RELATIONSHIPS_PAGE_SIZE=10
      - DEFAULT_PAGE_SIZE=100
      - MAX_PAGE_SIZE=10000
      - SCHEMA_DEBUG_JSON=1
      - CONFIG_API_SECRET=myverysecuresecret
      - CONFIG_API_IPS_ACLS=[{"allow":true,"ip":"0.0.0.0/0"}]
      
  mysql:
    image: mariadb:latest
    ports:
      - "3308:3306"
    environment:
      - MYSQL_DATABASE=myapp
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - ./.docker_data/mysql:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro

